name: fSnippetCli
options:
  bundleIdPrefix: kr.finfra
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: BZDZFZWF6K
    PRODUCT_NAME: fSnippetCli
    MARKETING_VERSION: "1.1.2"

targets:
  fSnippetCli:
    type: application
    platform: macOS
    sources:
      - path: fSnippetCli
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.finfra.fSnippetCli
        INFOPLIST_FILE: fSnippetCli/Info.plist
        CODE_SIGN_ENTITLEMENTS: fSnippetCli/fSnippetCli.entitlements
        GENERATE_INFOPLIST_FILE: false
        # Issue242: the app icon is an Official Build Component (cli/resources/official/), not
        # an asset-catalog icon — the build phase below installs it into official builds only
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_HARDENED_RUNTIME: true
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
    entitlements:
      path: fSnippetCli/fSnippetCli.entitlements
    postBuildScripts:
      # Issue238·242: bundle Official Build Components (marker, terms, app icon) only when FSNIPPET_OFFICIAL_BUILD=YES
      - name: Official Build Components
        basedOnDependencyAnalysis: false
        script: /bin/sh "${SRCROOT}/_tool/fsc-official-components.sh"
        outputFiles:
          # state stamp — rewritten only when the bundled state changes, so Xcode re-signs then
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/OfficialBuildState
    scheme:
      testTargets:
        - fSnippetCliTests

  fSnippetCliTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: fSnippetCliTests
    dependencies:
      - target: fSnippetCli
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.finfra.fSnippetCliTests
        PRODUCT_NAME: fSnippetCliTests
        GENERATE_INFOPLIST_FILE: true
